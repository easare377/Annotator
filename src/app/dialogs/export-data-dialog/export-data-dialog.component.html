<div class="dialog-container container-dark" *ngIf="visible">
  <section class="export-dialog" role="dialog" aria-modal="true" aria-labelledby="export-dialog-title">
    <header class="export-dialog-header">
      <div>
        <h2 id="export-dialog-title">Export data</h2>
        <p>
          Choose a format to download your dataset.
        </p>
      </div>
      <button type="button" class="close-button" aria-label="Close export dialog" (click)="hideDialog()">
        &times;
      </button>
    </header>
    <div class="export-message">
      Export dataset in the following format.
    </div>
    <div class="export-type-list" aria-label="Export formats">
      <app-export-data-type [typeText]="'SEGMENTATION MASK'"
                            [typeDescription]="'Grayscale class masks, RGB mask previews, and source images packaged in a ZIP file.'"
                            (selected)="exportData(ExportType.SEGMENTATION_MASK);">
      </app-export-data-type>
      <app-export-data-type [typeText]="'JSON'"
                            [typeDescription]="'List of items in raw JSON format stored in one JSON file. Use to export both the data and the ' +
       'annotations for a dataset. It`s Label Studio Common Format'"
                            (selected)="exportData(ExportType.JSON);">
      </app-export-data-type>

      <app-export-data-type [typeText]="'YOLO'"
                            [typeDescription]="'Popular TXT format is created for each image file. Each txt file ' +
                             'contains annotations for the corresponding image file, that is object class, object coordinates, height & width.'"
                            [disabled]="true">
      </app-export-data-type>

      <app-export-data-type [typeText]="'PASCAL VOC XML'"
                            [typeDescription]="'Popular XML format used for object detection and polygon image segmentation tasks.'"
                            (selected)="exportData(ExportType.PASCAL_VOC);">
      </app-export-data-type>

    </div>
  </section>
</div>
