<div id="parent" #parent [class.pan-enabled]="panEnabled" [class.panning]="isPanning" (wheel)="onWheel($event)">
  <!--Canvas to show the image-->
  <canvas #imgCanvas></canvas>
  <!--Canvas to show and control the polygons-->
  <canvas id="canvas" #polygonCanvas
          [class.pan-enabled]="panEnabled"
          [class.panning]="isPanning"
          [class.prompt-enabled]="isPromptModeActive"
          (pointerdown)="onPointerDown($event)"
          (pointermove)="onPointerMove($event)"
          (pointerup)="onPointerUp($event)"
          (pointercancel)="onPointerCancel($event)"
          (lostpointercapture)="onPointerCancel($event)">
  </canvas>
  <!--Canvas to show point and bounding-box prompts-->
  <canvas #promptCanvas class="prompt-canvas"></canvas>

  <div class="image-load-state" *ngIf="isImageLoading" role="status" aria-live="polite">
    <span class="image-loader" aria-hidden="true"></span>
    <span>Loading image</span>
  </div>

  <div class="image-load-state image-load-error" *ngIf="imageLoadFailed" role="alert">
    <span>Image could not be loaded.</span>
    <button type="button" (click)="retryImageLoad()">Retry</button>
  </div>
</div>
