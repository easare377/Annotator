<div class="user-dropdown" clickOutside (clickOutside)="closeMenu()" *ngIf="user$ | async as user">
  <button #menuButton type="button" class="user-trigger" aria-haspopup="menu"
          [attr.aria-expanded]="open" aria-controls="user-menu"
          [attr.aria-label]="'User menu for ' + displayName(user)"
          (click)="toggleMenu()" (keydown.arrowdown)="openFromKeyboard($event)">
    <span class="user-avatar" aria-hidden="true">{{ initials(user) }}</span>
    <!-- <span class="user-name">{{ displayName(user) }}</span> -->
    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
      <path d="m6 8 4 4 4-4"></path>
    </svg>
  </button>

  <div *ngIf="open" id="user-menu" class="user-menu" role="menu" aria-label="User menu">
    <div class="user-summary">
      <span class="user-avatar large" aria-hidden="true">{{ initials(user) }}</span>
      <div>
        <strong>{{ displayName(user) }}</strong>
        <span>{{ user.email }}</span>
      </div>
    </div>

    <a #firstMenuItem routerLink="/" role="menuitem" (click)="closeMenu()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path d="M3 10.8 12 3l9 7.8"></path><path d="M5 9.5V21h14V9.5"></path>
      </svg>
      Account
    </a>

    <div class="menu-divider"></div>

    <button type="button" role="menuitem" class="sign-out" [disabled]="signingOut" (click)="signOut()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path d="M10 17l5-5-5-5"></path><path d="M15 12H3"></path><path d="M15 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4"></path>
      </svg>
      {{ signingOut ? 'Signing out…' : 'Sign out' }}
    </button>

    <p *ngIf="error" class="user-menu-error" role="alert">{{ error }}</p>
  </div>
</div>
