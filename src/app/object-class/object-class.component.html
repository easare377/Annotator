<div class="class-row" [class.active]="active">
  <span class="swatch" [style.background-color]="objectClassVm.color"></span>
  <span class="name" [title]="objectClassVm.className">{{ objectClassVm.className }}</span>
  <span class="count" [title]="annotationCount + ' annotations'">{{ annotationCount }}</span>
  <span class="check" *ngIf="active">&#10003;</span>
</div>
